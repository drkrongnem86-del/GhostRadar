name: ghost_radar
description: "👻 Ghost Radar v1.5.0 - Tesla-style YOLOv8n 80-class detection + NMS + tracking + low-freq audio"
publish_to: "none"
version: 2.0.0+6

environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # Ghi âm / microphone
  record: ^5.2.1
  permission_handler: ^11.3.1
  # La bàn (accelerometer + magnetometer → heading)
  sensors_plus: ^6.1.1
  # Camera (dùng làm input cho YOLOv8)
  camera: ^0.12.0
  # YOLOv8n TFLite inference (Tesla-style real-time 80-class COCO)
  tflite_flutter: ^0.11.0
  # Resize/convert image bytes
  image: ^4.5.4
  # Quyền truy cập thư mục
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

dependency_overrides:
  # record_linux 0.7.2 không tương thích record_platform_interface 1.6.0
  # (thiếu implement startStream); ép dùng bản 1.0.x tương thích Dart 3
  record_linux: ^1.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/yolov8n.tflite
