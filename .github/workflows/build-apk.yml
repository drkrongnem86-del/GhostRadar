name: Build Ghost Radar APK (Flutter)

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Samsung A17 = ARM64. ubuntu-latest có sẵn JDK 17
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # camera 0.12 / record_android 1.5 cần Android SDK platform 36
      - name: Set up Android SDK (platform 36, build-tools 36)
        uses: android-actions/setup-android@v3
        with:
          api-level: 36
          build-tools-version: 36.0.0

      # Flutter >= 3.35 (Dart >= 3.9) cần cho camera 0.12.x
      - name: Set up Flutter (3.35.0 stable)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.0"
          channel: stable
          cache: true

      - name: Show Flutter / Java info
        run: |
          flutter --version
          java -version

      - name: Flutter pub get
        run: flutter pub get

      - name: Analyze (best-effort)
        run: flutter analyze || true

      - name: Build APK (Samsung A17 — arm64, minSdk 24, targetSdk 34)
        run: |
          flutter build apk \
            --release \
            --target-platform android-arm64

      - name: Locate APK files
        id: apk
        run: |
          echo "==== APK files produced ===="
          find build/app/outputs/flutter-apk -type f -name "*.apk" -print
          APK=$(find build/app/outputs/flutter-apk -type f -name "*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "::error::No APK file found"
            exit 1
          fi
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "Selected APK: $APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GhostRadar-APK
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release (only for v* tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: true
          fail_on_unmatched_files: false
