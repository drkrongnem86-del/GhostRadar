name: ghost_radar
description: "👻 Ghost Radar - Phân tích tín hiệu âm thanh hạ tần 0.5-20 Hz trên Android"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # Ghi âm / microphone
  record: ^5.2.1
  permission_handler: ^11.3.1
  # La bàn (accelerometer + magnetometer → heading)
  sensors_plus: ^6.1.1
  # Camera (dùng làm "IR âm bản" giả lập)
  camera: ^0.12.0
  # ML Kit Object Detection (Tesla-style real-time)
  google_mlkit_object_detection: ^0.13.0
  google_mlkit_commons: ^0.8.0
  # Quyền truy cập thư mục
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

dependency_overrides:
  # record_linux 0.7.2 không tương thích record_platform_interface 1.6.0
  # (thiếu implement startStream); ép dùng bản 1.0.x tương thích Dart 3
  record_linux: ^1.0.0

flutter:
  uses-material-design: true
